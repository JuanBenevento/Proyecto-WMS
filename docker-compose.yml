# =============================================================================
# WMS Enterprise - Docker Compose for Local Development
# =============================================================================
# Usage:
#   - Development:    docker-compose up -d
#   - With logs:      docker-compose up
#   - Stop:           docker-compose down
#   - Rebuild:        docker-compose up --build
#   - Clean:          docker-compose down -v (deletes volumes!)
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_DB: wms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wms_secret_pass
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wms-network

  # -----------------------------------------------------------------------------
  # WMS Backend (Spring Boot)
  # -----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-backend
    environment:
      # Database - references the postgres service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: wms_secret_pass
      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL-AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # Flyway migrations
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE-ON-MIGRATE: "true"
      # Security
      # JWT_SECRET_KEY debe ser Base64 válido de >=32 bytes (JwtService lo decodifica en @PostConstruct).
      # Este valor es solo para DEV LOCAL: base64("dev-only-jwt-secret-key-32bytes!").
      JWT_SECRET_KEY: ZGV2LW9ubHktand0LXNlY3JldC1rZXktMzJieXRlcyE=
      JWT_EXPIRATION: "86400000"
      # Server
      SERVER_PORT: "8080"
      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      # Multi-tenant schema isolation (S1/S2): ACTIVADO — el dev local corre el camino real.
      # Si se desactiva, /actuator/health queda DOWN a propósito (garantía de aislamiento ausente).
      WMS_TENANT_ISOLATION_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget (busybox) porque la imagen runtime alpine NO trae curl
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - wms-network
    restart: unless-stopped

  # -----------------------------------------------------------------------------
  # WMS Frontend (Angular)
  # -----------------------------------------------------------------------------
  frontend:
    build:
      context: ./wms-frontend
      dockerfile: Dockerfile
    container_name: wms-frontend
    environment:
      # API URL - points to backend service
      NG_API_URL: http://localhost:8080/api/v1
    ports:
      - "4200:80"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 en vez de localhost: busybox wget resuelve ::1 (IPv6) primero
      # y nginx solo escucha en IPv4 -> "Connection refused" permanente.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wms-network
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  wms-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes (Persistent Data)
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local