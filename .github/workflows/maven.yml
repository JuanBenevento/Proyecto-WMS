name: WMS Java CI with Maven 🚀

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: branca
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Fijar Docker API version para Testcontainers
        # Testcontainers 1.21.x fuerza por defecto API Docker 1.44 y su fallback a 1.32
        # está bugado (testcontainers-java#11360), así que contra el daemon de este runner
        # (API máx 1.48, ver testcontainers-java#10788) termina en
        # "client version 1.52 is too new. Maximum supported API version is 1.48".
        #
        # La forma canónica de forzar la versión que docker-java (subyacente a
        # Testcontainers) negocia es el file ~/.docker-java.properties con api.version,
        # según el workaround validado en testcontainers-java#10788 (caso idéntico:
        # runner GH Actions + Docker API 1.48). DOCKER_API_VERSION NO funciona aquí:
        # es una env var del CLI de Docker, docker-java usa la key "api.version".
        # Ver odd/tasks/real-persistence.md L7-L8.
        run: |
          echo "api.version=1.48" > "$HOME/.docker-java.properties"
          cat "$HOME/.docker-java.properties"
          echo "--- Diagnóstico Docker del runner ---"
          docker version --format 'client={{.Client.APIVersion}} server={{.Server.APIVersion}}'
          echo "--- Prueba de contenedor efímero (lo que Testcontainers hará) ---"
          docker run --rm hello-world

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean verify